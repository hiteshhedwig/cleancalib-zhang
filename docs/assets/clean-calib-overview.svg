<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">The clean-calib camera calibration pipeline</title>
  <desc id="desc">A technical diagram showing checkerboard images becoming homographies, camera intrinsics, poses, and a refined camera model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65756d"/></marker>
  </defs>
  <rect width="1200" height="360" fill="#fbfaf7"/><rect x="24" y="24" width="1152" height="312" fill="none" stroke="#d8ddd8"/>
  <text x="56" y="67" fill="#26352e" font-family="Georgia,serif" font-size="27">The calibration pipeline</text>
  <text x="56" y="94" fill="#65756d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">A from-scratch implementation of Zhang’s planar calibration method.</text>

  <g transform="translate(56 132)">
    <rect x="0" y="0" width="214" height="126" fill="#e8efeb" stroke="#b7c5bd"/><rect x="13" y="13" width="188" height="100" fill="#f7f9f6" stroke="#c7d0ca"/>
    <g transform="translate(45 27) skewX(-10)"><rect width="124" height="76" fill="#fff" stroke="#394840" stroke-width="1.5"/>
      <g fill="#394840"><path d="M0 0h19v19H0zM38 0h19v19H38zM76 0h19v19H76zM114 0h19v19H114z"/><path d="M19 19h19v19H19zM57 19h19v19H57zM95 19h19v19H95z"/><path d="M0 38h19v19H0zM38 38h19v19H38zM76 38h19v19H76zM114 38h19v19H114z"/><path d="M19 57h19v19H19zM57 57h19v19H57zM95 57h19v19H95z"/></g>
      <g fill="#c9794d" stroke="#fff7ed" stroke-width="1"><circle cx="29" cy="29" r="2.6"/><circle cx="67" cy="29" r="2.6"/><circle cx="105" cy="29" r="2.6"/><circle cx="29" cy="48" r="2.6"/><circle cx="67" cy="48" r="2.6"/><circle cx="105" cy="48" r="2.6"/></g>
    </g>
    <text x="0" y="151" fill="#26352e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">checkerboard images</text><text x="0" y="171" fill="#65756d" font-family="ui-monospace,monospace" font-size="12">ordered subpixel corners</text>
  </g>

  <path d="M294 195H340" fill="none" stroke="#65756d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M555 195H601" fill="none" stroke="#65756d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M816 195H862" fill="none" stroke="#65756d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g fill="#fff" stroke="#b7c5bd"><rect x="340" y="132" width="215" height="126"/><rect x="601" y="132" width="215" height="126"/><rect x="862" y="132" width="282" height="126"/></g>
  <g font-family="ui-monospace,monospace">
    <text x="362" y="161" fill="#3e7760" font-size="11" font-weight="700">01  HOMOGRAPHIES</text><text x="362" y="199" fill="#26352e" font-family="Georgia,serif" font-size="25">H₁, H₂, …, Hₙ</text><text x="362" y="226" fill="#65756d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">normalized DLT</text>
    <text x="623" y="161" fill="#3e7760" font-size="11" font-weight="700">02  ZHANG INITIALIZATION</text><text x="623" y="199" fill="#26352e" font-family="Georgia,serif" font-size="25">K, R, t</text><text x="623" y="226" fill="#65756d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">closed-form intrinsics and poses</text>
    <text x="884" y="161" fill="#3e7760" font-size="11" font-weight="700">03  NONLINEAR REFINEMENT</text><text x="884" y="199" fill="#26352e" font-family="Georgia,serif" font-size="25">camera + distortion</text><text x="884" y="226" fill="#65756d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Levenberg–Marquardt minimizes reprojection error</text>
  </g>
  <line x1="56" y1="310" x2="1144" y2="310" stroke="#d8ddd8"/><text x="56" y="334" fill="#3e7760" font-family="ui-monospace,monospace" font-size="12">13/13 views detected</text><text x="412" y="334" fill="#65756d" font-family="ui-monospace,monospace" font-size="12">final RMS 0.1828 px</text><text x="760" y="334" fill="#65756d" font-family="ui-monospace,monospace" font-size="12">C++17 · Eigen · stb</text>
</svg>
