<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">clean-calib camera calibration pipeline</title>
  <desc id="desc">Checkerboard corners flow through homography estimation, Zhang initialization and nonlinear refinement to produce a camera model.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#193044"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity=".38"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6ee7b7"/></marker>
    <pattern id="mesh" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#334155" opacity=".24"/></pattern>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#background)"/><rect width="1200" height="430" rx="22" fill="url(#mesh)"/>
  <rect x="24" y="24" width="1152" height="382" rx="16" fill="none" stroke="#475569" stroke-opacity=".7"/>
  <text x="62" y="63" fill="#6ee7b7" font-family="ui-monospace,monospace" font-size="13" font-weight="700" letter-spacing="3">CLEAN-CALIB / FROM PIXELS TO PARAMETERS</text>
  <text x="62" y="103" fill="#f8fafc" font-family="Georgia,serif" font-size="29">An inspectable implementation of Zhang’s calibration method.</text>
  <text x="62" y="130" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Corner detection → homographies → closed-form K → nonlinear refinement</text>
  <g filter="url(#shadow)"><rect x="62" y="168" width="230" height="158" rx="11" fill="#f8fafc"/><rect x="74" y="180" width="206" height="134" rx="6" fill="#d5e4df"/>
    <g transform="translate(98 198) skewX(-12)"><rect width="160" height="112" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
      <g fill="#172033"><path d="M0 0h20v20H0zM40 0h20v20H40zM80 0h20v20H80zM120 0h20v20H120z"/><path d="M20 20h20v20H20zM60 20h20v20H60zM100 20h20v20H100zM140 20h20v20H140z"/><path d="M0 40h20v20H0zM40 40h20v20H40zM80 40h20v20H80zM120 40h20v20H120z"/><path d="M20 60h20v20H20zM60 60h20v20H60zM100 60h20v20H100zM140 60h20v20H140z"/><path d="M0 80h20v20H0zM40 80h20v20H40zM80 80h20v20H80zM120 80h20v20H120z"/></g>
      <g fill="#fb923c" stroke="#fff7ed" stroke-width="1"><circle cx="30" cy="30" r="3"/><circle cx="70" cy="30" r="3"/><circle cx="110" cy="30" r="3"/><circle cx="30" cy="50" r="3"/><circle cx="70" cy="50" r="3"/><circle cx="110" cy="50" r="3"/><circle cx="30" cy="70" r="3"/><circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/></g>
    </g>
  </g>
  <text x="62" y="354" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">01 / detect corners</text><text x="62" y="376" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="12">Harris + saddle scoring + subpixel</text>
  <path d="M310 247H350" stroke="#6ee7b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 247H610" stroke="#6ee7b7" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 247H870" stroke="#6ee7b7" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="350" y="190" width="220" height="114" rx="11" fill="#1e293b" stroke="#456455"/><rect x="610" y="190" width="220" height="114" rx="11" fill="#1e293b" stroke="#456455"/><rect x="870" y="171" width="268" height="152" rx="11" fill="#f8fafc"/></g>
  <text x="375" y="220" fill="#6ee7b7" font-family="ui-monospace,monospace" font-size="11" font-weight="700">02 / HOMOGRAPHY</text><text x="375" y="255" fill="#f8fafc" font-family="Georgia,serif" font-size="26">H ↔ board</text><text x="375" y="280" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">normalized DLT</text>
  <text x="635" y="220" fill="#6ee7b7" font-family="ui-monospace,monospace" font-size="11" font-weight="700">03 / ZHANG + LM</text><text x="635" y="255" fill="#f8fafc" font-family="Georgia,serif" font-size="26">K, R, t</text><text x="635" y="280" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">closed form → refine</text>
  <text x="895" y="201" fill="#1f6b4f" font-family="ui-monospace,monospace" font-size="11" font-weight="700">04 / CAMERA MODEL</text><text x="895" y="235" fill="#172033" font-family="Georgia,serif" font-size="25">K + distortion</text><text x="895" y="263" fill="#64748b" font-family="ui-monospace,monospace" font-size="12">fx 532.65 · fy 532.61</text><text x="895" y="284" fill="#64748b" font-family="ui-monospace,monospace" font-size="12">cx 342.93 · cy 233.82</text><rect x="895" y="295" width="218" height="21" rx="4" fill="#dce9e1"/><text x="1004" y="310" text-anchor="middle" fill="#1f6b4f" font-family="ui-monospace,monospace" font-size="11" font-weight="700">0.1828 px final RMS</text>
  <line x1="62" y1="394" x2="1138" y2="394" stroke="#475569"/><text x="62" y="416" fill="#6ee7b7" font-family="ui-monospace,monospace" font-size="12" font-weight="700">13 / 13 REAL VIEWS</text><text x="455" y="416" fill="#fb923c" font-family="ui-monospace,monospace" font-size="12" font-weight="700">C++17 · EIGEN · STB</text><text x="905" y="416" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="12">PYTHON + GUI</text>
</svg>
